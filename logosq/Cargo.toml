[package]
name = "logosq_benchmark"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "logosq_benchmark"
path = "src/main.rs"

[[example]]
name = "gradient_bugs"
path = "MemoryCircuitDifferentiation/logosq_gradient_bugs.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
num-complex = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.7"
nalgebra = "0.32"
logosq = "0.2.3"
tqdm = "0.8.0"

[[example]]
name = "qft_benchmark_simple"
path = "QuantumFourierTransform/qft_benchmark_simple.rs"

[[example]]
name = "vqa"
path = "VQA/vqa.rs"

[[example]]
name = "xyz_heisenberg"
path = "XYZHeisenberg/xyz_h.rs"