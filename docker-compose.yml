version: '3.8'

services:
  benchmark:
    build: .
    container_name: logosq-benchmark
    ports:
      - "8080:8080"
    volumes:
      - .:/app:cached
      - ./results:/app/results
      - ./logs:/app/logs
    environment:
      - RUST_LOG=info
    # Keep container running for Dev Containers
    command: sleep infinity